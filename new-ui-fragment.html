      <!-- 新版战报自动监听 v2.0 -->
      <div id="helperTaskPanel" class="helperTaskPanelWrap" style="margin-top:10px;padding:12px 14px;background:linear-gradient(135deg,rgba(240,180,41,.08),rgba(116,192,252,.04));border-radius:8px;border:1.5px solid rgba(240,180,41,.25);">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <span style="font-size:13px;font-weight:700;color:var(--accent);">⚡ 战报自动监听</span>
          <span style="font-size:11px;color:var(--text3);margin-left:auto;">每个项目独立 · 极简配置 · 自动处理</span>
        </div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:8px;">监听目录:</div>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <input type="text" id="ocrWatchFolder" placeholder="待设置目录"
            style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--text);">
          <button class="btn btn-sm btn-secondary" onclick="selectOcrWatchFolder()">选择目录</button>
        </div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:8px;">状态:</div>
        <div style="font-size:13px;color:var(--text3);margin-bottom:10px;" id="ocrWatchStatus">加载中...</div>
        <div style="background:var(--bg3);border-radius:8px;padding:12px;margin-bottom:10px;">
          <div style="display:flex;gap:16px;align-items:center;">
            <div style="flex:1;text-align:center;">
              <div style="font-size:18px;font-weight:700;color:var(--text);" id="ocrWatchPending">0</div>
              <div style="font-size:11px;color:var(--text3);margin-top:4px;">待处理</div>
            </div>
            <div style="flex:1;text-align:center;">
              <div style="font-size:18px;font-weight:700;color:var(--text);" id="ocrWatchProcessed">0</div>
              <div style="font-size:11px;color:var(--text3);margin-top:4px;">已处理</div>
            </div>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button class="btn btn-sm btn-primary" id="btnOcrWatchStart" onclick="startOcrWatchTask()" style="flex:1;">开始</button>
          <button class="btn btn-sm btn-secondary" id="btnOcrWatchPause" onclick="pauseOcrWatchTask()" style="flex:1;">暂停</button>
          <button class="btn btn-sm btn-danger" id="btnOcrWatchStop" onclick="stopOcrWatchTask()" style="flex:1;">停止</button>
        </div>
        <div style="font-size:11px;color:var(--text3);" id="ocrWatchError"></div>
        <div style="font-size:10px;color:var(--text3);" id="ocrWatchHeartbeat"></div>
      </div>
