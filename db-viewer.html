<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>真武 · 数据库管理工具</title>
<style>
/* ========== 全局重置与变量 ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0c0f1a;
  --bg2:       #121729;
  --bg3:       #1a2038;
  --bg4:       #232a45;
  --accent:    #f0b429;
  --accent2:   #ffd166;
  --red:       #ff6b6b;
  --green:     #51cf66;
  --blue:      #74c0fc;
  --orange:    #ff922b;
  --cyan:      #66d9e8;
  --purple:    #d4a5ff;
  --text:      #e8eaed;
  --text2:     #8b95a8;
  --text3:     #505b6e;
  --border:    #252d44;
  --card:      #151a2e;
  --radius:    10px;
  --shadow:    0 4px 24px rgba(0,0,0,.4);
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.6;
}

/* ========== 滚动条 ========== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* ========== 登录面板 ========== */
.login-wrap {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 20px;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(240,180,41,.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(116,192,252,.04) 0%, transparent 50%),
    var(--bg);
}
.login-card {
  width: 400px; max-width: 90vw;
  background: linear-gradient(145deg, var(--card), var(--bg2));
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px 32px;
  box-shadow: var(--shadow);
}
.login-card .logo {
  text-align: center; margin-bottom: 32px;
}
.login-card .logo h1 {
  font-size: 24px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: 2px;
}
.login-card .logo p {
  font-size: 12px; color: var(--text3); margin-top: 6px;
}
.form-group { margin-bottom: 20px; }
.form-group label {
  display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px;
  font-weight: 500;
}
.form-group input {
  width: 100%; height: 42px;
  padding: 0 14px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text);
  font-size: 14px; outline: none; transition: border .2s;
}
.form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(240,180,41,.15); }
.form-group input::placeholder { color: var(--text3); }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 42px; padding: 0 24px;
  border: none; border-radius: var(--radius);
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all .2s; gap: 6px;
  white-space: nowrap;
}
.btn-primary {
  width: 100%; background: linear-gradient(135deg, var(--accent), #d49a1f);
  color: #1a1200;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(240,180,41,.35); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.login-error {
  background: rgba(255,107,107,.1); border: 1px solid rgba(255,107,107,.25);
  color: var(--red); padding: 10px 14px; border-radius: var(--radius);
  font-size: 13px; margin-bottom: 16px; display: none;
}

/* ========== 主界面 ========== */
.app-wrap { display: none; min-height: 100vh; flex-direction: column; }

/* 顶栏 */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 24px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-left h1 {
  font-size: 18px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.topbar-badge {
  font-size: 11px; padding: 2px 8px; background: rgba(81,207,102,.12);
  color: var(--green); border-radius: 10px; font-weight: 600;
}
.topbar-right { display: flex; align-items: center; gap: 12px; }
.user-info { font-size: 13px; color: var(--text2); }
.user-info strong { color: var(--text); }
.btn-sm {
  height: 32px; padding: 0 14px; font-size: 12px;
  background: var(--bg3); color: var(--text2);
  border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer; transition: all .2s;
}
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }

/* 内容区 */
.main-content { flex: 1; padding: 24px; max-width: 1600px; margin: 0 auto; width: 100%; }

/* 表卡片网格 */
.section-title {
  font-size: 15px; font-weight: 600; color: var(--text);
  margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
}
.section-title::before {
  content: ''; width: 3px; height: 16px; background: var(--accent);
  border-radius: 2px;
}

.table-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px; margin-bottom: 28px;
}
.table-card {
  position: relative; cursor: pointer;
  background: linear-gradient(145deg, var(--card), var(--bg2));
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 16px; transition: all .2s;
  overflow: hidden;
}
.table-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 2px; background: transparent;
  transition: background .2s;
}
.table-card:hover {
  border-color: var(--accent); transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,.3);
}
.table-card:hover::before { background: var(--accent); }
.table-card.active {
  border-color: var(--accent); background: linear-gradient(145deg, rgba(240,180,41,.08), var(--card));
}
.table-card.active::before { background: var(--accent); }
.tcard-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; word-break: break-all; }
.tcard-count { font-size: 12px; color: var(--text3); }
.tcard-count .num { color: var(--cyan); font-weight: 700; font-size: 16px; }

/* 数据查看区 */
.data-section { display: none; }
.data-section.show { display: block; }

.toolbar {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  flex-wrap: wrap;
}
.toolbar input[type="text"] {
  height: 36px; padding: 0 12px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 13px;
  outline: none; width: 220px; transition: border .2s;
}
.toolbar input[type="text"]:focus { border-color: var(--accent); }
.toolbar input[type="text"]::placeholder { color: var(--text3); }
.toolbar select {
  height: 36px; padding: 0 10px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 13px;
  outline: none; cursor: pointer; min-width: 80px;
}
.btn-toolbar {
  height: 36px; padding: 0 16px; font-size: 13px;
  background: var(--bg3); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer; transition: all .2s; display: inline-flex; align-items: center; gap: 4px;
}
.btn-toolbar:hover { border-color: var(--accent); color: var(--accent); }
.btn-toolbar.accent {
  background: linear-gradient(135deg, var(--accent), #d49a1f); color: #1a1200;
  border: none; font-weight: 600;
}
.btn-toolbar.accent:hover { box-shadow: 0 2px 12px rgba(240,180,41,.3); }
.current-table-label {
  font-size: 13px; color: var(--text2); white-space: nowrap;
}
.current-table-label strong { color: var(--accent); }

/* 数据表格 */
.table-container {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
}
.data-table {
  width: 100%; border-collapse: collapse; display: block;
  overflow-x: auto; white-space: nowrap;
}
.data-table thead { display: table-header-group; width: 100%; }
.data-table tbody { display: table-row-group; }
.data-table th, .data-table td {
  padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border);
  font-size: 13px; vertical-align: middle;
}
.data-table th {
  background: var(--bg3); color: var(--text2); font-weight: 600;
  position: sticky; top: 0; z-index: 2;
  user-select: none; cursor: pointer; white-space: nowrap;
  transition: color .15s;
}
.data-table th:hover { color: var(--accent); }
.data-table th .sort-icon { margin-left: 4px; font-size: 11px; color: var(--text3); }
.data-table th.sorted .sort-icon { color: var(--accent); }
.data-table tr:last-child td { border-bottom: none; }
.data-table tbody tr { transition: background .15s; }
.data-table tbody tr:hover { background: rgba(240,180,41,.04); }
.data-table td { max-width: 300px; overflow: hidden; text-overflow: ellipsis; }

/* 单元格内容格式化 */
.cell-json { color: var(--purple); font-family: "SF Mono", Consolas, monospace; font-size: 12px; }
.cell-date { color: var(--cyan); white-space: nowrap; }
.cell-sensitive { color: var(--red); font-weight: 600; }
.cell-null { color: var(--text3); font-style: italic; }
.cell-number { color: var(--orange); font-variant-numeric: tabular-nums; }
.cell-long { cursor: help; position: relative; }

/* 表结构面板 */
.desc-panel {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 16px;
  overflow: hidden; display: none;
}
.desc-panel.show { display: block; }
.desc-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: var(--bg3);
  border-bottom: 1px solid var(--border);
}
.desc-header h3 { font-size: 14px; font-weight: 600; }
.desc-body { padding: 16px; overflow-x: auto; }
.desc-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.desc-table th, .desc-table td {
  padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.desc-table th { background: var(--bg2); color: var(--text2); font-weight: 600; }
.desc-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-bottom: 14px; }
.meta-item { background: var(--bg2); padding: 8px 12px; border-radius: 6px; }
.meta-item .label { font-size: 11px; color: var(--text3); }
.meta-item .value { font-size: 14px; color: var(--text); font-weight: 600; margin-top: 2px; }

/* 索引标签 */
.idx-tag {
  display: inline-block; font-size: 10px; padding: 1px 6px;
  border-radius: 4px; font-weight: 600; margin-right: 4px;
}
.idx-pri { background: rgba(240,180,41,.15); color: var(--accent); }
.idx-uni { background: rgba(116,192,252,.15); color: var(--blue); }
.idx-norm { background: rgba(139,149,168,.15); color: var(--text2); }

/* 分页 */
.pagination {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; margin-top: 16px; flex-wrap: wrap;
}
.page-btn {
  height: 34px; min-width: 34px; padding: 0 10px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text2); font-size: 13px;
  cursor: pointer; transition: all .15s; display: inline-flex;
  align-items: center; justify-content: center;
}
.page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.page-btn.active { background: var(--accent); color: #1a1200; border-color: var(--accent); font-weight: 700; }
.page-btn:disabled { opacity: .35; cursor: not-allowed; }
.page-info { font-size: 13px; color: var(--text3); margin: 0 8px; }

/* 状态提示 */
.status-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); margin-top: 12px; font-size: 13px;
}
.status-bar .left { color: var(--text2); }
.status-bar .right { color: var(--text3); }

/* Loading */
.loading-overlay {
  position: absolute; inset: 0;
  background: rgba(12,15,26,.75); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  z-index: 50; border-radius: var(--radius);
}
.spinner {
  width: 36px; height: 36px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast 提示 */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 20px; border-radius: var(--radius); font-size: 13px;
  color: #fff; animation: slideIn .3s ease; box-shadow: var(--shadow);
  max-width: 380px;
}
.toast.error { background: linear-gradient(135deg, #cc3333, #a52626); }
.toast.success { background: linear-gradient(135deg, #2d8a4e, #236b3c); }
.toast.info { background: linear-gradient(135deg, var(--blue), #5599cc); }
@keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

/* 空状态 */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text3);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: .4; }
.empty-state p { font-size: 14px; }

/* 响应式 */
@media (max-width: 768px) {
  .main-content { padding: 16px; }
  .table-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .toolbar { flex-direction: column; align-items: stretch; }
  .toolbar input[type="text"], .toolbar select { width: 100%; }
  .topbar { padding: 0 16px; }
  .topbar .user-info { display: none; }
}
</style>
</head>
<body>

<!-- ========== 登录页 ========== -->
<div class="login-wrap" id="loginPage">
  <div class="login-card">
    <div class="logo">
      <h1>⚔️ 真武 DB Viewer</h1>
      <p>数据库管理工具 · 仅限超级管理员</p>
    </div>
    <div class="login-error" id="loginError"></div>
    <div class="form-group">
      <label>手机号</label>
      <input type="tel" id="phoneInput" placeholder="请输入管理员手机号" autocomplete="tel" autofocus>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="pwdInput" placeholder="请输入密码" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">
      🔐 登 录
    </button>
  </div>
</div>

<!-- ========== 主应用 ========== -->
<div class="app-wrap" id="appPage">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <h1>⚔️ 真武 DB Viewer</h1>
      <span class="topbar-badge">只读模式</span>
    </div>
    <div class="topbar-right">
      <span class="user-info">👤 <strong id="userInfoName">-</strong></span>
      <button class="btn-sm" onclick="doLogout()">退出登录</button>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="main-content">

    <!-- 表列表区域 -->
    <div id="tablesSection">
      <div class="section-title">数据表列表</div>
      <div class="table-grid" id="tableGrid"></div>
    </div>

    <!-- 数据查看区域 -->
    <div class="data-section" id="dataSection">

      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <button class="btn-toolbar" onclick="backToTableList()" style="font-size:13px;">← 返回表列表</button>
        <span class="current-table-label">当前表: <strong id="currentTableLabel">-</strong></span>
      </div>

      <!-- 工具栏 -->
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="搜索关键字..." onkeydown="if(event.key==='Enter')doSearch()">
        <select id="pageSizeSelect" onchange="changePageSize()">
          <option value="10">10 条/页</option>
          <option value="20" selected>20 条/页</option>
          <option value="50">50 条/页</option>
          <option value="100">100 条/页</option>
        </select>
        <button class="btn-toolbar accent" onclick="doSearch()">🔍 查询</button>
        <button class="btn-toolbar" onclick="toggleDesc()">📋 表结构</button>
        <button class="btn-toolbar" onclick="refreshData()" title="刷新数据">↻ 刷新</button>
      </div>

      <!-- 表结构面板 -->
      <div class="desc-panel" id="descPanel">
        <div class="desc-header">
          <h3>📋 表结构 — <span id="descTableName"></span></h3>
          <button class="btn-sm" onclick="toggleDesc()">收起</button>
        </div>
        <div class="desc-body" id="descBody"></div>
      </div>

      <!-- 数据表格 -->
      <div class="table-container" style="position:relative;" id="tableContainerWrap">
        <div class="loading-overlay" id="dataLoading" style="display:none;">
          <div class="spinner"></div>
        </div>
        <table class="data-table" id="dataTable">
          <thead><tr id="theadRow"></tr></thead>
          <tbody id="tbodyRow"></tbody>
        </table>
      </div>

      <!-- 分页 -->
      <div class="pagination" id="pagination"></div>

      <!-- 状态栏 -->
      <div class="status-bar" id="statusBar" style="display:none;">
        <span class="left" id="statusLeft"></span>
        <span class="right" id="statusRight"></span>
      </div>
    </div>

  </main>
</div>

<!-- Toast 容器 -->
<div class="toast-container" id="toastBox"></div>

<script>
// ==================== 配置 ====================
const API_BASE = 'https://api.zhenwu.fun/api';

// ==================== 状态管理 ====================
let state = {
  token: '',
  user: null,
  tables: [],           // [{name, count}]
  currentTable: null,
  columns: [],          // 当前表的列信息
  page: 1,
  pageSize: 20,
  sortField: 'id',
  sortOrder: 'ASC',     // ASC | DESC
  search: '',
  pagination: null
};

// ==================== API 封装 ====================
function apiHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.token };
}

async function apiGet(path) {
  const res = await fetch(API_BASE + path, { headers: apiHeaders() });
  const json = await res.json();
  if (res.status === 401) { logout(); throw new Error('登录已过期'); }
  if (!res.ok) throw new Error(json.message || `请求失败(${res.status})`);
  return json;
}

async function apiPost(path, body) {
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    headers: apiHeaders(),
    body: JSON.stringify(body)
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.message || `请求失败(${res.status})`);
  return json;
}

// ==================== Toast ====================
let toastTimer = null;
function showToast(msg, type='info') {
  const box = document.getElementById('toastBox');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3200);
}

// ==================== 登录/退出 ====================
async function doLogin() {
  const phone = document.getElementById('phoneInput').value.trim();
  const pwd   = document.getElementById('pwdInput').value;
  const errEl = document.getElementById('loginError');
  const btn   = document.getElementById('loginBtn');

  if (!phone || !pwd) { showToast('请输入手机号和密码','error'); return; }

  btn.disabled = true; btn.textContent = '登录中...';
  errEl.style.display = 'none';

  try {
    const res = await apiPost('/auth/login', { phone, password: pwd });
    if (res.code === 200 && res.data?.token) {
      state.token = res.data.token;
      state.user = res.data.user;
      localStorage.setItem('dbv_token', state.token);
      localStorage.setItem('dbv_user', JSON.stringify(state.user));

      // 校验是否超管
      if (state.user.roleId !== 'super_admin' && !(state.user.permissions && state.user.permissions.superAdmin)) {
        showToast('仅超级管理员可使用此工具','error');
        logout(); return;
      }

      showApp();
      loadTables();
      showToast(`欢迎回来，${state.user.nickname || state.user.phone}`,'success');
    } else {
      errEl.textContent = res.message || '登录失败'; errEl.style.display = 'block';
    }
  } catch(e) {
    errEl.textContent = e.message || '网络错误，请检查连接'; errEl.style.display = 'block';
  } finally { btn.disabled = false; btn.textContent = '🔐 登 录'; }
}

function doLogout() { logout(); }

function logout() {
  state.token = ''; state.user = null;
  localStorage.removeItem('dbv_token');
  localStorage.removeItem('dbv_user');
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('appPage').style.display = 'none';
  document.getElementById('pwdInput').value = '';
}

// ==================== 页面切换 ====================
function showApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display = 'flex';
  document.getElementById('userInfoName').textContent = state.user?.nickname || state.user?.phone || '-';
}

function showDataSection() {
  document.getElementById('tablesSection').style.display = 'none';
  document.getElementById('dataSection').classList.add('show');
}

function showTablesSection() {
  document.getElementById('tablesSection').style.display = 'block';
  document.getElementById('dataSection').classList.remove('show');
  document.getElementById('descPanel').classList.remove('show');
}

// ==================== 加载表列表 ====================
async function loadTables() {
  try {
    const res = await apiGet('/db/tables');
    if (res.code === 200) {
      state.tables = res.data;
      renderTableGrid();
    }
  } catch(e) {
    showToast('加载表列表失败: '+e.message,'error');
  }
}

function renderTableGrid() {
  const grid = document.getElementById('tableGrid');
  grid.innerHTML = '';

  // 表名中文映射
  const nameMap = {
    users:'用户表', roles:'角色表', projects:'项目表', project_members:'项目成员表',
    battle_records:'战报记录表', battle_gallery:'战报图片表', ocr_tasks:'OCR任务表',
    system_logs:'系统日志表', team_plans:'团队计划表', yanwu_records:'演武记录表',
    user_credits:'用户积分表', credit_logs:'积分流水表'
  };

  for (const t of state.tables) {
    const card = document.createElement('div');
    card.className = 'table-card' + (state.currentTable === t.name ? ' active' : '');
    card.innerHTML = `
      <div class="tcard-name">${nameMap[t.name]||t.name}</div>
      <div class="tcard-count"><span class="num">${t.count>=0?t.count:'-'}</span> 条记录</div>`;
    card.onclick = () => selectTable(t.name);
    card.dataset.table = t.name;
    grid.appendChild(card);
  }
}

// ==================== 选择表 / 加载数据 ====================
function selectTable(name) {
  state.currentTable = name;
  state.page = 1;
  state.search = '';
  state.sortField = 'id';
  state.sortOrder = 'ASC';
  document.getElementById('searchInput').value = '';
  document.getElementById('currentTableLabel').textContent = name;
  document.getElementById('descPanel').classList.remove('show');

  // 更新卡片激活状态
  document.querySelectorAll('.table-card').forEach(c => c.classList.toggle('active', c.dataset.table === name));

  showDataSection();
  loadData();
}

async function loadData(showLoading=true) {
  const loading = document.getElementById('dataLoading');
  if (showLoading) loading.style.display = 'flex';

  const params = new URLSearchParams({
    page: state.page,
    pageSize: state.pageSize,
    sort: state.sortField,
    order: state.sortOrder
  });
  if (state.search) params.set('search', state.search);

  try {
    const res = await apiGet(`/db/table/${state.currentTable}?${params}`);
    if (res.code === 200) {
      const d = res.data;
      state.columns = d.columns;
      state.pagination = d.pagination;
      renderDataTable(d.rows);
      renderPagination(d.pagination);
      updateStatusBar(d);
    }
  } catch(e) {
    showToast('查询失败: '+e.message,'error');
    document.getElementById('tbodyRow').innerHTML =
      '<tr><td colspan="100" class="empty-state"><p>❌ '+e.message+'</p></td></tr>';
  } finally { loading.style.display = 'none'; }
}

// ==================== 渲染数据表格 ====================
function renderDataTable(rows) {
  const thead = document.getElementById('theadRow');
  const tbody = document.getElementById('tbodyRow');

  // 表头
  let h = '';
  for (const col of state.columns) {
    const isSorted = state.sortField === col.field;
    let arrow = '';
    if (isSorted) arrow = state.sortOrder === 'ASC' ? ' ▲' : ' ▼';
    h += `<th class="${isSorted?'sorted':''}" onclick="sortTable('${col.field}')">
      ${col.field}<span class="sort-icon">${arrow}</span></th>`;
  }
  thead.innerHTML = h;

  // 表体
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="${state.columns.length}" class="empty-state">
      <div class="icon">📭</div><p>暂无数据</p></td></tr>`;
    return;
  }

  let b = '';
  for (const row of rows) {
    b += '<tr>';
    for (const col of state.columns) {
      b += `<td>${formatCell(row[col.field], col)}</td>`;
    }
    b += '</tr>';
  }
  tbody.innerHTML = b;
}

function formatCell(val, col) {
  if (val === null || val === undefined) return '<span class="cell-null">NULL</span>';
  if (val === '****') return '<span class="cell-sensitive">****</span>';

  const type = (col.type || '').toLowerCase();

  // JSON 字段检测
  if (typeof val === 'string' &&
      (val.startsWith('{') || val.startsWith('[')) &&
      (type.includes('json') || type.includes('text') || type.includes('varchar'))) {
    try {
      const parsed = JSON.parse(val);
      const short = JSON.stringify(parsed).length > 200
        ? JSON.stringify(parsed).slice(0,200)+'…'
        : JSON.stringify(parsed);
      return `<span class="cell-json" title="${escAttr(val)}">${escHtml(short)}</span>`;
    } catch {}
  }

  // 数字
  if (typeof val === 'number' || (type.includes('int') || type.includes('decimal') || type.includes('float') || type.includes('double'))) {
    return `<span class="cell-number">${escHtml(String(val))}</span>`;
  }

  // 日期时间（MySQL datetime/timestamp）
  if (type.includes('datetime') || type.includes('timestamp')) {
    return `<span class="cell-date">${escHtml(String(val))}</span>`;
  }

  // 长文本截断
  const strVal = String(val);
  if (strVal.length > 120) {
    return `<span class="cell-long" title="${escAttr(strVal)}">${escHtml(strVal.slice(0,120))}…</span>`;
  }

  return escHtml(strVal);
}

// ==================== 排序 / 分页 / 搜索 ====================
function sortTable(field) {
  if (state.sortField === field) {
    state.sortOrder = state.sortOrder === 'ASC' ? 'DESC' : 'ASC';
  } else {
    state.sortField = field;
    state.sortOrder = 'ASC';
  }
  state.page = 1;
  loadData();
}

function goPage(page) {
  if (page < 1 || page > state.pagination.totalPages) return;
  state.page = page;
  loadData();
}

function changePageSize() {
  state.pageSize = parseInt(document.getElementById('pageSizeSelect').value);
  state.page = 1;
  loadData();
}

function doSearch() {
  state.search = document.getElementById('searchInput').value.trim();
  state.page = 1;
  loadData();
}

function refreshData() { loadData(); }

// 渲染分页控件
function renderPagination(pag) {
  const el = document.getElementById('pagination');
  if (pag.totalPages <= 1) { el.innerHTML = ''; return; }

  const total = pag.totalPages;
  const cur  = pag.page;

  let html = `<button class="page-btn" onclick="goPage(${cur-1})" ${cur<=1?'disabled':''}>上一页</button>`;

  // 页码逻辑
  let pages = [];
  pages.push(1);
  if (cur > 3) pages.push('...');
  for (let i=Math.max(2,cur-1); i<=Math.min(total-1,cur+1); i++) pages.push(i);
  if (cur < total-2) pages.push('...');
  if (total > 1) pages.push(total);

  for (const p of pages) {
    if (p === '...') html += `<span class="page-info">…</span>`;
    else html += `<button class="page-btn ${p===cur?'active':''}" onclick="goPage(${p})">${p}</button>`;
  }

  html += `<button class="page-btn" onclick="goPage(${cur+1})" ${cur>=total?'disabled':''}>下一页</button>`;
  html += `<span class="page-info">共 ${pag.total} 条 / ${total} 页</span>`;

  el.innerHTML = html;
}

// 更新状态栏
function updateStatusBar(d) {
  const bar = document.getElementById('statusBar');
  bar.style.display = 'flex';
  document.getElementById('statusLeft').textContent = `✅ 已加载 ${state.currentTable} · 第 ${d.pagination.page}/${d.pagination.totalPages} 页`;
  document.getElementById('statusRight').textContent = `共 ${d.pagination.total} 条记录 · ${d.columns.length} 个字段`;
}

// ==================== 返回表列表 ====================
function backToTableList() {
  state.currentTable = null;
  showTablesSection();
}

// ==================== 表结构 =================---
async function toggleDesc() {
  const panel = document.getElementById('descPanel');
  if (panel.classList.contains('show')) {
    panel.classList.remove('show');
    return;
  }
  panel.classList.add('show');
  document.getElementById('descTableName').textContent = state.currentTable;

  const body = document.getElementById('descBody');
  body.innerHTML = '<div style="text-align:center;padding:30px;"><div class="spinner"></div></div>';

  try {
    const res = await apiGet(`/db/table/${state.currentTable}/desc`);
    if (res.code === 200) renderDesc(res.data);
  } catch(e) {
    body.innerHTML = '<p style="color:var(--red)">加载失败: '+e.message+'</p>';
  }
}

function renderDesc(data) {
  const fmtBytes = b => b >= 1048576 ? (b/1048576).toFixed(1)+' MB' : b >= 1024 ? (b/1024).toFixed(1)+' KB' : b+' B';

  let meta = `
    <div class="desc-meta">
      <div class="meta-item"><div class="label">表名</div><div class="value">${escHtml(data.table)}</div></div>
      <div class="meta-item"><div class="label">注释</div><div class="value">${data.comment||'-'}</div></div>
      <div class="meta-item"><div class="label">行数</div><div class="value">${data.rows??'~'}</div></div>
      <div class="meta-item"><div class="label">数据大小</div><div class="value">${fmtBytes(data.dataSize||0)}</div></div>
      <div class="meta-item"><div class="label">索引大小</div><div class="value">${fmtBytes(data.indexSize||0)}</div></div>
      <div class="meta-item"><div class="label">自增ID</div><div class="value">${data.autoIncrement??'-'}</div></div>
    </div>`;

  // 列信息表
  let cols = `<table class="desc-table"><thead><tr>
    <th>字段</th><th>类型</th><th>允许空</th><th>键</th><th>默认值</th><th>额外</th><th>注释</th>
  </tr></thead><tbody>`;
  for (const c of data.columns) {
    let keyTag = '';
    if (c.key === 'PRI') keyTag = '<span class="idx-tag idx-pri">主键</span>';
    else if (c.key === 'UNI') keyTag = '<span class="idx-tag idx-uni">唯一</span>';
    else if (c.key === 'MUL') keyTag = '<span class="idx-tag idx-norm">索引</span>';

    cols += `<tr>
      <td style="color:var(--cyan);font-weight:600;font-family:monospace">${escHtml(c.field)}</td>
      <td style="color:var(--purple);font-family:monospace;font-size:11.5px">${escHtml(c.type)}</td>
      <td>${c.nullable?'<span style="color:var(--text3)">YES</span>':'<span style="color:var(--red)">NO</span>'}</td>
      <td>${keyTag||'-'}</td>
      <td style="color:var(--text2)">${c.default!==null&&c.default!==undefined?escHtml(String(c.default)):'<span class="cell-null">NULL</span>'}</td>
      <td style="color:var(--text3);font-size:11.5px">${c.extra||'-'}</td>
      <td style="color:var(--text3)">${c.comment||'-'}</td>
    </tr>`;
  }
  cols += '</tbody></table>';

  // 索引信息
  let idxHtml = '';
  if (data.indexes && data.indexes.length > 0) {
    idxHtml = '<div style="margin-top:14px;"><div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text)">📑 索引列表</div>';
    for (const idx of data.indexes) {
      let cls = idx.name==='PRIMARY'?'idx-pri':(idx.unique?'idx-uni':'idx-norm');
      idxHtml += `<div style="display:inline-flex;align-items:center;margin:0 8px 6px 0;">
        <span class="idx-tag ${cls}">${idx.unique?'UNI':'IDX'}</span>
        <code style="background:var(--bg2);padding:2px 8px;border-radius:4px;font-size:11.5px;color:var(--text);">
        ${escHtml(idx.name)} (${idx.columns.join(', ')})</code></div>`;
    }
    idxHtml += '</div>';
  }

  document.getElementById('descBody').innerHTML = meta + cols + idxHtml;
}

// ==================== 工具函数 ====================
function escHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ==================== 自动登录恢复 =================---
function tryAutoLogin() {
  const savedToken = localStorage.getItem('dbv_token');
  const savedUser  = localStorage.getItem('dbv_user');
  if (savedToken && savedUser) {
    state.token = savedToken;
    try { state.user = JSON.parse(savedUser); } catch {}
    if (state.user) { showApp(); loadTables(); return; }
  }
  document.getElementById('loginPage').style.display = 'flex';
}

// ==================== 启动 ====================
tryAutoLogin();
</script>
