<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket OCR 监控</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    h1 {
      color: #4ec9b0;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .status {
      background: #252526;
      border: 1px solid #3e3e42;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #3e3e42;
    }
    .status-item:last-child { border-bottom: none; }
    .label { color: #9cdcfe; font-weight: 500; }
    .value { color: #ce9178; }
    .value.success { color: #4ec9b0; }
    .value.error { color: #f48771; }
    .value.warning { color: #dcdcaa; }

    .messages {
      background: #252526;
      border: 1px solid #3e3e42;
      border-radius: 8px;
      padding: 20px;
      max-height: 600px;
      overflow-y: auto;
    }
    .messages h2 {
      color: #4ec9b0;
      font-size: 18px;
      margin-bottom: 15px;
    }
    .message {
      background: #1e1e1e;
      border-left: 3px solid #4ec9b0;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 4px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
    }
    .message.error { border-left-color: #f48771; }
    .message.warning { border-left-color: #dcdcaa; }
    .message-time {
      color: #858585;
      font-size: 11px;
      margin-bottom: 5px;
    }
    .message-type {
      color: #4ec9b0;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .message-data {
      color: #d4d4d4;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .task-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .task-card {
      background: #252526;
      border: 1px solid #3e3e42;
      border-radius: 8px;
      padding: 15px;
    }
    .task-card h3 {
      color: #4ec9b0;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .task-field {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 13px;
    }

    .clear-btn {
      background: #0e639c;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }
    .clear-btn:hover {
      background: #1177bb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔌 WebSocket OCR 实时监控</h1>

    <div class="status">
      <div class="status-item">
        <span class="label">当前任务</span>
        <select id="task-selector" class="value" style="background: #1e1e1e; color: #ce9178; border: 1px solid #3e3e42; padding: 5px 10px; border-radius: 4px; cursor: pointer;">
          <option value="">加载中...</option>
        </select>
      </div>
      <div class="status-item">
        <span class="label">连接状态</span>
        <span class="value" id="connection-status">未连接</span>
      </div>
      <div class="status-item">
        <span class="label">服务器地址</span>
        <span class="value" id="server-url">-</span>
      </div>
      <div class="status-item">
        <span class="label">已接收消息</span>
        <span class="value success" id="message-count">0</span>
      </div>
      <div class="status-item">
        <span class="label">运行时长</span>
        <span class="value" id="uptime">0秒</span>
      </div>
    </div>

    <div class="task-info" id="task-info">
      <!-- 任务信息卡片动态插入 -->
    </div>

    <div class="status-card" style="margin-top: 20px; padding: 20px; background: #1e1e1e; border-radius: 8px; border-left: 4px solid #9b59b6;">
      <h2 style="margin-top: 0; color: #9b59b6;">📊 数据库统计</h2>
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 15px;">
        <div>
          <div style="color: #95a5a6; font-size: 14px; margin-bottom: 5px;">自动战报解析列表</div>
          <div id="db-auto-reports" style="color: #3498db; font-size: 24px; font-weight: bold;">-/-</div>
        </div>
        <div>
          <div style="color: #95a5a6; font-size: 14px; margin-bottom: 5px;">数据底表</div>
          <div id="db-total-records" style="color: #9b59b6; font-size: 24px; font-weight: bold;">- 条</div>
        </div>
      </div>
    </div>

    <div class="messages">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>📨 实时消息流</h2>
        <button class="clear-btn" onclick="clearMessages()">清空消息</button>
      </div>
      <div id="message-list"></div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    const SERVER_URL = 'http://localhost:3000';
    let messageCount = 0;
    let startTime = Date.now();
    let socket = null;
    let taskStates = new Map();
    let allTasks = [];
    let currentProjectId = null;

    function init() {
      document.getElementById('server-url').textContent = SERVER_URL;

      // 先获取任务列表
      fetchTaskList();

      socket = io(SERVER_URL, {
        path: '/ws'
      });

      socket.on('connect', () => {
        updateStatus('已连接', 'success');
        addMessage('system', 'WebSocket 连接成功', { socketId: socket.id });

        // 如果已经选择了任务，重新加入房间
        if (currentProjectId) {
          joinProjectRoom(currentProjectId);
        }
      });

      socket.on('disconnect', () => {
        updateStatus('已断开', 'error');
        addMessage('system', 'WebSocket 连接断开', {});
      });

      socket.on('connect_error', (err) => {
        updateStatus('连接错误', 'error');
        addMessage('error', '连接错误', { error: err.message });
      });

      // 监听任务更新
      socket.on('task-update', (data) => {
        messageCount++;
        updateMessageCount();
        addMessage('task-update', '任务状态更新', data);
        updateTaskCard(data);
      });

      // 监听本地助手注册
      socket.on('helper-registered', (data) => {
        messageCount++;
        updateMessageCount();
        addMessage('helper-registered', '本地助手注册成功', data);
      });

      // 监听本地助手上线
      socket.on('helper-online', (data) => {
        messageCount++;
        updateMessageCount();
        addMessage('helper-online', '本地助手上线', data);
      });

      // 监听本地助手离线
      socket.on('helper-offline', (data) => {
        messageCount++;
        updateMessageCount();
        addMessage('helper-offline', '本地助手离线', data);
      });

      // 监听助手状态
      socket.on('helper-status', (data) => {
        messageCount++;
        updateMessageCount();
        addMessage('helper-status', '助手状态', data);
      });

      // 更新运行时长
      setInterval(() => {
        const seconds = Math.floor((Date.now() - startTime) / 1000);
        const minutes = Math.floor(seconds / 60);
        const hours = Math.floor(minutes / 60);

        let uptimeText = '';
        if (hours > 0) {
          uptimeText = `${hours}小时 ${minutes % 60}分 ${seconds % 60}秒`;
        } else if (minutes > 0) {
          uptimeText = `${minutes}分 ${seconds % 60}秒`;
        } else {
          uptimeText = `${seconds}秒`;
        }

        document.getElementById('uptime').textContent = uptimeText;
      }, 1000);

      // 初始加载数据库统计
      fetchDatabaseStats();
      // 每30秒更新一次数据库统计
      setInterval(fetchDatabaseStats, 30000);
    }

    function updateStatus(text, type) {
      const el = document.getElementById('connection-status');
      el.textContent = text;
      el.className = `value ${type}`;
    }

    function updateMessageCount() {
      document.getElementById('message-count').textContent = messageCount;
    }

    function addMessage(type, title, data) {
      const messageList = document.getElementById('message-list');
      const message = document.createElement('div');

      const isError = type.includes('error') || type.includes('offline');
      const isWarning = type.includes('warning');

      message.className = `message ${isError ? 'error' : isWarning ? 'warning' : ''}`;

      const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });

      message.innerHTML = `
        <div class="message-time">${time}</div>
        <div class="message-type">${type}</div>
        <div class="message-data">${JSON.stringify(data, null, 2)}</div>
      `;

      messageList.insertBefore(message, messageList.firstChild);

      // 限制消息数量
      while (messageList.children.length > 100) {
        messageList.removeChild(messageList.lastChild);
      }
    }

    function updateTaskCard(data) {
      const taskId = data.taskId || data.id || data.helperTaskId;
      if (!taskId) return;

      taskStates.set(taskId, data);
      renderTaskCards();

      // 同时更新数据库统计
      fetchDatabaseStats();
    }

    function renderTaskCards() {
      const container = document.getElementById('task-info');
      container.innerHTML = '';

      taskStates.forEach((data, taskId) => {
        const card = document.createElement('div');
        card.className = 'task-card';

        const statusText = {
          'idle': '空闲',
          'processing': '处理中',
          'pending': '待处理',
          'done': '已完成',
          'failed': '失败'
        }[data.status] || data.status;

        const fields = [];

        // 待处理
        fields.push(`<div class="task-field"><span>待处理:</span><span style="color: #f39c12; font-weight: bold; font-size: 18px;">${data.pendingCount || 0}</span></div>`);

        // 解析中
        fields.push(`<div class="task-field"><span>解析中:</span><span style="color: #3498db; font-weight: bold; font-size: 18px;">${data.processingCount || 0}</span></div>`);

        // 已处理
        fields.push(`<div class="task-field"><span>已处理:</span><span style="color: #27ae60; font-weight: bold; font-size: 18px;">${data.processedCount || 0}</span></div>`);

        // 处理失败
        fields.push(`<div class="task-field"><span>处理失败:</span><span style="color: #e74c3c; font-weight: bold; font-size: 18px;">${data.failedCount || 0}</span></div>`);

        // 当前状态
        fields.push(`<div class="task-field"><span>当前状态:</span><span style="color: #3498db; font-weight: bold;">${statusText}</span></div>`);

        // 当前处理文件
        const currentFileDisplay = data.currentFile ? data.currentFile : '无';
        fields.push(`<div class="task-field"><span>当前处理文件:</span><span style="color: #4ec9b0">${currentFileDisplay}</span></div>`);

        // 待处理文件列表
        let pendingFilesDisplay = '无';
        if (data.pendingFiles && data.pendingFiles.length > 0) {
          pendingFilesDisplay = data.pendingFiles.join(', ');
        }
        fields.push(`<div class="task-field"><span>待处理文件列表:</span><span style="color: #95a5a6; font-size: 12px;">${pendingFilesDisplay}</span></div>`);

        // 最后心跳
        let heartbeatDisplay = '-';
        if (data.lastHeartbeat) {
          const hbTime = new Date(data.lastHeartbeat);
          heartbeatDisplay = hbTime.toLocaleTimeString('zh-CN', { hour12: false });
        }
        fields.push(`<div class="task-field"><span>最后心跳:</span><span style="color: #95a5a6">${heartbeatDisplay}</span></div>`);

        // 最后错误
        const errorDisplay = data.lastError ? data.lastError : '无';
        fields.push(`<div class="task-field"><span>最后错误:</span><span style="color: #f48771">${errorDisplay}</span></div>`);

        card.innerHTML = `
          <h3>📋 任务监控 #${taskId}</h3>
          ${fields.join('')}
        `;

        container.appendChild(card);
      });
    }

    async function fetchDatabaseStats() {
      try {
        // 如果没有选中任务，不查询统计
        if (!currentProjectId) {
          return;
        }

        const response = await fetch(`${SERVER_URL}/api/ocr-stats?projectId=${currentProjectId}`);
        const result = await response.json();

        if (result.code === 200 && result.data) {
          const stats = result.data;

          // 更新自动战报解析列表
          const autoReportsEl = document.getElementById('db-auto-reports');
          if (autoReportsEl && stats.autoReports) {
            autoReportsEl.textContent = `${stats.autoReports.processed}/${stats.autoReports.total}`;
          }

          // 更新数据底表
          const totalRecordsEl = document.getElementById('db-total-records');
          if (totalRecordsEl && stats.totalRecords !== undefined) {
            totalRecordsEl.textContent = `${stats.totalRecords} 条`;
          }
        }
      } catch (err) {
        console.error('获取数据库统计失败:', err);
      }
    }

    function clearMessages() {
      document.getElementById('message-list').innerHTML = '';
      messageCount = 0;
      updateMessageCount();
    }

    function joinProjectRoom(projectId) {
      currentProjectId = projectId;
      socket.emit('join-project', projectId);
      addMessage('system', '已加入项目房间', { projectId: projectId });

      // 切换任务后，立即刷新数据库统计
      fetchDatabaseStats();
    }

    async function fetchTaskList() {
      try {
        const response = await fetch(`${SERVER_URL}/api/ocr-watch/tasks/monitor?userId=1`);
        const result = await response.json();

        if (result.code === 200 && Array.isArray(result.data)) {
          allTasks = result.data;
          const selector = document.getElementById('task-selector');

          if (allTasks.length === 0) {
            selector.innerHTML = '<option value="">无可用任务</option>';
            return;
          }

          selector.innerHTML = allTasks.map(task =>
            `<option value="${task.projectId}">任务 #${task.id} (项目 ${task.projectId})</option>`
          ).join('');

          // 默认选择第一个任务
          const firstTask = allTasks[0];
          selector.value = firstTask.projectId;
          currentProjectId = firstTask.projectId;

          // 监听切换事件
          selector.addEventListener('change', (e) => {
            const newProjectId = parseInt(e.target.value);
            if (newProjectId && newProjectId !== currentProjectId) {
              joinProjectRoom(newProjectId);
            }
          });

          // 如果已连接，加入第一个任务的房间
          if (socket && socket.connected) {
            joinProjectRoom(firstTask.projectId);
          }
        }
      } catch (err) {
        console.error('获取任务列表失败:', err);
        document.getElementById('task-selector').innerHTML = '<option value="">加载失败</option>';
      }
    }

    // 页面加载时初始化
    init();
  </script>
</body>
</html>
